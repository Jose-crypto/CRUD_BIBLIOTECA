<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">



<h:head>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>


</h:head>

<h:body>
    <!-- Mensaje de error customizado -->
    <p:growl id="msj" showDetail="true" life="3000" />
    <h:form>
        <div class="container-fluid d-flex justify-content-center align-items-center" style="height: 100vh;">

            <!-- Panel de login con Bootstrap -->
            <div class="card shadow-sm" style="max-width: 400px; width: 100%;">

                <!-- Título del Panel -->
                <div class="card-header text-center">
                    <h5>Iniciar Sesion</h5>
                </div>

                <div class="card-body">
                    <!-- Campo de correo electrónico -->
                    <div class="form-group">
                        <h:outputLabel for="usuario" value="Usuario" styleClass="form-label" />
                        <p:inputText id="usuario" value="#{loginBean.username}" placeholder="Ingrese usuario" required="true"
                                     styleClass="form-control" />
                        <h:message for="usuario" styleClass="text-danger" />
                    </div>

                    <!-- Campo de contraseña -->
                    <div class="form-group">
                        <h:outputLabel for="password" value="Password" styleClass="form-label" />
                        <p:password id="password" value="#{loginBean.password}" placeholder="Contraseña" required="true"
                                    styleClass="form-control" feedback="true" />
                        <h:message for="password" styleClass="text-danger" />
                    </div>

                    <!-- Botón de enviar -->
                    <p:commandButton value="Acceder" action="#{loginBean.login}"
                                     styleClass="btn btn-primary btn-block" update="msj" />
                    <h:outputLink value="#" onclick="PF('createUserModal').show();">Registrarse</h:outputLink>

                </div>
            </div>
        </div>
    </h:form>



    <!-- Modal para crear un nuevo usuario -->
    <p:dialog header="Crear Nuevo Usuario" widgetVar="createUserModal" visible="#{loginBean.modalVisible}" modal="true" showEffect="fade" hideEffect="fade">
        <h:form id="createnewuser">
            <p:panelGrid columns="2">
                <h:outputLabel for="Username" value="Usuario: " />
                <h:inputText id="Username" value="#{loginBean.username}" required="true" class="form-control"/>

                <h:outputLabel for="Password" value="Password: " />
                <h:inputText id="Password" value="#{loginBean.password}" required="true" class="form-control" />

                <p:commandButton update="createnewuser :msj" action="#{loginBean.createUser}" value="Crear Usuario" oncomplete="PF('createUserModal').hide();" class="btn btn-warning mt-3" />
             </p:panelGrid>
        </h:form>
    </p:dialog>



</h:body>

</html>
